name: sdk
on: 
  workflow_dispatch:
jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Projects
      uses: actions/checkout@v4
      
    - name: Installation depends
      run: |
        sudo apt update
        sudo apt install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget
        
    - name: Clone source code
      run: |
        wget https://downloads.openwrt.org/snapshots/targets/airoha/an7581/openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst
        tar -I zstd -xf openwrt-sdk-*.zst && rm -r openwrt-sdk-*.zst
        ls

    - name: add custom package
      run: |
        cd openwrt-sdk*/package
        git clone https://github.com/science2468/luci-app-usque.git
        ls

    - name: update feed
      run: |
        cd openwrt-sdk*
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: download
      run: |
        cd openwrt-sdk*
        cat > .config <<EOF
        CONFIG_USE_APK=y
        CONFIG_PACKAGE_apk-mbedtls=y
        CONFIG_DEFAULT_openwrt-keyring=y
        EOF

        make defconfig
        make package/luci-app-usque/download V=s
        
    - name: build
      run: |
        cd openwrt-sdk*
        make -j$(nproc) package/luci-app-usque/{clean,compile} V=s
        
    - name: Upload openwrt firmware
      uses: softprops/action-gh-release@master
      with:
        tag_name: luci-app-usque
        files: openwrt-sdk*/bin/**/*usque*
